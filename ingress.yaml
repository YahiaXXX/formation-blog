
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blog-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: srv2052563.hstgr.cloud
      http:
        paths:
          - path: /yahia
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 3000

    - host: srv2052563.hstgr.cloud
      http:
        paths:
          - path: /yahia/admin
            pathType: Prefix
            backend:
              service:
                name: admin
                port:
                  number: 80
