# =====================================================================
# Blog platform on Kubernetes: MariaDB cluster (3 pods, replicated with Galera) + backend + web + admin
# Deploy:   kubectl apply -f blog-platform-mariadb.yaml
# Needs:    the mariadb-operator running in this namespace (you installed it with helm)
# =====================================================================

# ---- Secret (change the passwords; no quotes/spaces/$)
apiVersion: v1
kind: Secret
metadata:
  name: blog-secrets
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "Root_ChangeMe_2026"
  MYSQL_PASSWORD: "Db_ChangeMe_2026"
  JWT_SECRET: "change-this-to-a-long-random-string-32chars-min"
  ADMIN_EMAIL: "admin@example.com"
  ADMIN_PASSWORD: "Admin_ChangeMe_2026"
---
# ---- 1) MARIADB CLUSTER: 3 pods, every pod holds the full data (Galera = synchronous replication)
# The operator creates the Services:
#   mysql-primary   -> the node that receives the writes (the backend uses this one)
#   mysql-secondary -> the other nodes (reads)
#   mysql           -> generic service
# If the primary pod dies, the operator moves mysql-primary to another node automatically.
apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: mysql                   # kept as 'mysql' (same name as your first deployment)
spec:
  rootPasswordSecretKeyRef:
    name: blog-secrets
    key: MYSQL_ROOT_PASSWORD
  database: blog
  username: blog_user
  passwordSecretKeyRef:
    name: blog-secrets
    key: MYSQL_PASSWORD
  replicas: 3
  galera:
    enabled: true
  storage:
    size: 5Gi
  podMetadata:
    annotations:
      linkerd.io/inject: enabled
      config.linkerd.io/opaque-ports: "3306,4567,4568,4444"   # MariaDB + Galera ports
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }
---
# ---- 2) BACKEND (Express)   logs: kubectl logs deploy/backend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
      annotations:
        linkerd.io/inject: enabled
    spec:
      containers:
        - name: backend
          image: yahia14/blog-backend:2.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 4000
          env:
            - { name: PORT, value: "4000" }
            - { name: DB_HOST, value: mysql-primary }   # writes go to the Galera primary node
            - { name: DB_NAME, value: blog }
            - { name: DB_USER, value: blog_user }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: blog-secrets, key: MYSQL_PASSWORD } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: blog-secrets, key: JWT_SECRET } }
            - name: ADMIN_EMAIL
              valueFrom: { secretKeyRef: { name: blog-secrets, key: ADMIN_EMAIL } }
            - name: ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: blog-secrets, key: ADMIN_PASSWORD } }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 384Mi }
          readinessProbe:               # ready only when the database answers
            httpGet: { path: /ready, port: 4000 }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 4000 }
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector: { app: backend }
  ports:
    - { port: 4000, targetPort: 4000 }
---
# ---- 3) WEB (Next.js, users)   open with NodePort: kubectl get svc web
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
      annotations:
        linkerd.io/inject: enabled
    spec:
      containers:
        - name: web
          image: yahia14/blog-platform-web:1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - { name: API_URL, value: "http://backend:4000" }
            - { name: COOKIE_SECURE, value: "false" }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 384Mi }
          readinessProbe:
            httpGet: { path: /robots.txt, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  type: NodePort
  selector: { app: web }
  ports:
    - { port: 3000, targetPort: 3000 }
---
# ---- 4) ADMIN (React + nginx, forwards /api to backend)   open with NodePort: kubectl get svc admin
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
spec:
  replicas: 1
  selector:
    matchLabels: { app: admin }
  template:
    metadata:
      labels: { app: admin }
      annotations:
        linkerd.io/inject: enabled
    spec:
      containers:
        - name: admin
          image: yahia14/blog-platform-admin:1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: admin
spec:
  type: NodePort
  selector: { app: admin }
  ports:
    - { port: 80, targetPort: 80 }