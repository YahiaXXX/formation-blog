apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
spec:
  replicas: {{ .Values.admin.replicas }}
  selector:
    matchLabels:
      app: admin
  template:
    metadata:
      labels:
        app: admin
      annotations:
        {{- toYaml .Values.admin.podAnnotations | nindent 8 }}
    spec:
      containers:
        - name: admin
          image: "{{ .Values.admin.image.repository }}:{{ .Values.admin.image.tag }}"
          imagePullPolicy: {{ .Values.admin.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.admin.port }}
          resources:
            {{- toYaml .Values.admin.resources | nindent 12 }}
          {{- toYaml .Values.admin.probes | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: admin
spec:
  type: {{ .Values.admin.service.type }}
  selector:
    app: admin
  ports:
    - port: {{ .Values.admin.port }}
      targetPort: {{ .Values.admin.port }}
